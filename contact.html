<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — ShopNow</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>

  <header id="top">
    <div class="top-row">
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
      <div class="logo-box">ShopNow</div>
      <div class="top-actions">
        <a href="index.html" class="action">
          <span>🏠</span><span class="label">Home</span>
        </a>
      </div>
    </div>
  </header>

  <div id="overlay"></div>

  <nav id="menu">
    <button id="close-menu" class="close-btn">&times;</button>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About us</a></li>
      <li><a href="contact.html">Contact us</a></li>
      <li><a href="index.html#cart">My Cart</a></li>
    </ul>
  </nav>

  <main>
    <section class="card">
      <h2>Contact Us</h2>
      <p>We'd love to hear from you. Reach out through any of these channels:</p>
    </section>

    <section class="card">
      <h3>📧 Email</h3>
      <p><a href="mailto:michaelonedibe73@gmail.com" class="teal-link">michaelonedibe73@gmail.com</a></p>
    </section>

    <section class="card">
      <h3>📞 Phone</h3>
      <p><a href="tel:+2348124713885" class="teal-link">08124713885</a></p>
    </section>

    <section class="card">
      <h3>💬 WhatsApp</h3>
      <p><a href="https://wa.me/2348124713885?text=Hello%20ShopNow" class="teal-link" target="_blank">Chat with us on WhatsApp</a></p>
    </section>

    <section class="card">
      <h3>Send us a message</h3>
      <form id="contact-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 14px;">
        <input type="text" placeholder="Your Name" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
        <input type="email" placeholder="Your Email" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
        <textarea placeholder="Your Message" rows="5" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; font-family: inherit;"></textarea>
        <button type="submit" style="padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">Send Message</button>
      </form>
      <p id="contact-msg" style="margin-top: 12px; color: #0a7a3c; font-weight: bold;"></p>
    </section>
  </main>

  <footer>
    <div class="footer-bottom">
      <span>© 2026 ShopNow</span>
      <span class="socials"><b>f</b><b>ig</b><b>x</b></span>
    </div>
  </footer>

  <script>
    const hamburger = document.querySelector("#hamburger");
    const nav = document.querySelector("#menu");
    const overlay = document.querySelector("#overlay");
    const closeMenu = document.querySelector("#close-menu");

    hamburger.addEventListener("click", () => {
      nav.classList.add("active");
      overlay.classList.add("show");
    });

    closeMenu.addEventListener("click", () => {
      nav.classList.remove("active");
      overlay.classList.remove("show");
    });

    overlay.addEventListener("click", () => {
      nav.classList.remove("active");
      overlay.classList.remove("show");
    });

    document.querySelector("#contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.querySelector("#contact-msg").textContent = "✅ Message sent! We'll reply soon.";
      e.target.reset();
    });
  </script>

</body>
</html>
